<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1408"/>
      <stop offset="100%" stop-color="#0d0a04"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a254"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2218"/>
      <stop offset="100%" stop-color="#1e1810"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  
  <!-- Subtle border glow -->
  <rect x="3" y="3" width="250" height="250" rx="45" fill="none" stroke="#d4a254" stroke-opacity="0.15" stroke-width="2"/>
  
  <!-- Left page of open book -->
  <path d="M128 70 C128 70, 125 65, 60 58 C45 56, 38 60, 38 72 L38 175 C38 185, 45 188, 60 186 C120 180, 128 190, 128 190" fill="url(#page)" stroke="#d4a254" stroke-width="2.5" stroke-opacity="0.6"/>
  
  <!-- Right page of open book -->
  <path d="M128 70 C128 70, 131 65, 196 58 C211 56, 218 60, 218 72 L218 175 C218 185, 211 188, 196 186 C136 180, 128 190, 128 190" fill="url(#page)" stroke="#d4a254" stroke-width="2.5" stroke-opacity="0.6"/>
  
  <!-- Spine -->
  <line x1="128" y1="65" x2="128" y2="192" stroke="#d4a254" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Text lines on left page -->
  <line x1="55" y1="85" x2="112" y2="82" stroke="#d4a254" stroke-width="2" stroke-opacity="0.25" stroke-linecap="round"/>
  <line x1="55" y1="100" x2="108" y2="97" stroke="#d4a254" stroke-width="2" stroke-opacity="0.2" stroke-linecap="round"/>
  <line x1="55" y1="115" x2="105" y2="112" stroke="#d4a254" stroke-width="2" stroke-opacity="0.15" stroke-linecap="round"/>
  <line x1="55" y1="130" x2="100" y2="128" stroke="#d4a254" stroke-width="2" stroke-opacity="0.2" stroke-linecap="round"/>
  <line x1="55" y1="145" x2="95" y2="143" stroke="#d4a254" stroke-width="2" stroke-opacity="0.15" stroke-linecap="round"/>
  
  <!-- Text lines on right page -->
  <line x1="144" y1="82" x2="201" y2="85" stroke="#d4a254" stroke-width="2" stroke-opacity="0.25" stroke-linecap="round"/>
  <line x1="148" y1="97" x2="201" y2="100" stroke="#d4a254" stroke-width="2" stroke-opacity="0.2" stroke-linecap="round"/>
  <line x1="151" y1="112" x2="201" y2="115" stroke="#d4a254" stroke-width="2" stroke-opacity="0.15" stroke-linecap="round"/>
  <line x1="156" y1="128" x2="201" y2="130" stroke="#d4a254" stroke-width="2" stroke-opacity="0.2" stroke-linecap="round"/>
  
  <!-- Gold bookmark ribbon -->
  <path d="M165 42 L165 105 L175 92 L185 105 L185 42" fill="url(#gold)" opacity="0.9"/>
  
  <!-- Subtle ambient glow behind bookmark -->
  <ellipse cx="175" cy="75" rx="20" ry="35" fill="#d4a254" opacity="0.06"/>
</svg>